name: rental-info-sharing

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rental}
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
    ports:
      # 数据库只向宿主机本地开放；backend 通过 Compose 网络访问 postgres:5432。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 数据与容器生命周期分离，普通重建或 down 后仍保留。
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 检查数据库是否接受连接；账号密码与查询链路由后端健康接口验证。
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9.11-eclipse-temurin-21}
        JAVA_IMAGE: ${JAVA_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:21.0.12.1_1-jre}
    image: rental-info-sharing-backend:0.0.1
    restart: unless-stopped
    environment:
      # 容器内 localhost 指向自身，因此数据源必须使用 PostgreSQL 服务名。
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rental}?connectTimeout=3&socketTimeout=5
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rental}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
      SERVER_PORT: "8080"
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?请在 .env 中设置Base64编码的JWT随机签名密钥}
      AUTH_ISSUER: ${AUTH_ISSUER:-rental-info-sharing}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-rental-info-sharing-api}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-30m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      # 等数据库就绪后再启动，后端启动过程中自动校验并执行 Flyway 迁移。
      postgres:
        condition: service_healthy
    healthcheck:
      # 接口执行真实 SELECT 1；数据库不可用时返回 503，curl --fail 会使检查失败。
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "8", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  auth-test-postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    profiles: ["test"]
    environment:
      POSTGRES_DB: rental_schema_test_auth
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
    ports:
      # IDEA 在宿主机运行测试时连接此端口，容器测试仍使用服务名。
      - "127.0.0.1:${AUTH_TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      # 与业务 pgdata 分开，仅用于接口测试。
      - auth-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  auth-test:
    image: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9.11-eclipse-temurin-21}
    profiles: ["test"]
    working_dir: /workspace
    command: ["mvn", "--batch-mode", "--no-transfer-progress", "-Dtest=AuthFlowTest", "test"]
    environment:
      AUTH_INTEGRATION_TEST: "true"
      AUTH_TEST_DATABASE_URL: jdbc:postgresql://auth-test-postgres:5432/rental_schema_test_auth?connectTimeout=3&socketTimeout=5
      AUTH_TEST_DATABASE_USERNAME: ${POSTGRES_USER:-rental}
      AUTH_TEST_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
    volumes:
      - ./backend:/workspace
      - auth-test-maven-cache:/root/.m2
    depends_on:
      auth-test-postgres:
        condition: service_healthy

  migrate:
    # 独立迁移工具按需运行；日常 up 不启用 tools profile，避免与后端同时迁移。
    image: ${FLYWAY_IMAGE:-docker.m.daocloud.io/flyway/flyway:13.10.0-alpine}
    profiles: ["tools"]
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rental}
      FLYWAY_USER: ${POSTGRES_USER:-rental}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_SCHEMAS: public
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      # 只读挂载与后端相同的迁移目录，共用数据库中的 Flyway 版本历史。
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  auth-test-data:
  auth-test-maven-cache:
